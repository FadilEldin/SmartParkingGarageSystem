<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">iPark</h1>
        <h6 class="text-center mb-4">By Fadil Eldin</h6>
        <div class="row">
            <!-- Parking Controls -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h3>Park a Car</h3>
                    </div>
                    <div class="card-body">
                        <form id="parkForm">
                            <div class="mb-3">
                                <label for="licensePlate" class="form-label">License Plate</label>
                                <input type="text" class="form-control" id="licensePlate" required>
                            </div>
                            <div class="mb-3">
                                <label for="carSize" class="form-label">Car Size</label>
                                <select class="form-select" id="carSize" required>
                                    <option value="small">Small (Compact)</option>
                                    <option value="medium" selected>Medium (Standard)</option>
                                    <option value="large">Large (Oversized)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Park Car</button>
                        </form>
                        <div id="parkMessage" class="mt-3 alert" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- Exit Controls -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-danger text-white">
                        <h3>Exit Garage</h3>
                    </div>
                    <div class="card-body">
                        <form id="exitForm">
                            <div class="mb-3">
                                <label for="exitLicensePlate" class="form-label">License Plate</label>
                                <input type="text" class="form-control" id="exitLicensePlate" required>
                            </div>
                            <button type="submit" class="btn btn-danger">Exit Garage</button>
                        </form>
                        <div id="exitDetails" class="mt-3" style="display: none;">
                            <h5>Parking Details</h5>
                            <p>Duration: <span id="duration"></span> hours</p>
                            <p>Fee: $<span id="fee"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Garage Visualization -->
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h3>Garage Status</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h4>Available Spots</h4>
                        <div id="availableSpots" class="row"></div>
                    </div>
                    <div class="col-md-6">
                        <h4>Occupied Spots</h4>
                        <div id="occupiedSpots" class="row"></div>
                    </div>
                </div>

                <div class="mt-4">
                    <h4>Find a Car</h4>
                    <form id="findForm" class="row g-3">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="findLicensePlate" placeholder="Enter license plate">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-info w-100">Find</button>
                        </div>
                    </form>
                    <div id="carDetails" class="mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>


    <div class="card mb-4">
    <div class="card-header bg-info text-white">
        <h3>Floor Visualization</h3>
    </div>
    <div class="card-body">
        <div class="row g-3 align-items-center">
            <div class="col-md-8">
                <select id="floorSelect" class="form-select">
                    <option value="">Select a floor</option>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="col-md-4">
                <button id="visualizeBtn" class="btn btn-info w-100">Visualize</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
